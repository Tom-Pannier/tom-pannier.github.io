
name: Deploy Angular Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Angular Portfolio auschecken
      - name: Checkout Portfolio
        uses: actions/checkout@v4

      # El Pollo Loco separat auschecken
      - name: Checkout El Pollo Loco
        uses: actions/checkout@v4
        with:
          repository: Tom-Pannier/EL-Pollo-Loco
          ref: main
          path: el-pollo-loco

      # Node.js einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Abhängigkeiten installieren
      - name: Install dependencies
        run: npm ci

      # Angular bauen
      - name: Build Angular
        run: npm run build -- --base-href /

      # Spiel in den Angular-Build kopieren
      - name: Copy El Pollo Loco
        run: |
          mkdir -p dist/portfolio/el-pollo-loco
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            el-pollo-loco/ \
            dist/portfolio/el-pollo-loco/

      - name: Create 404 fallback
        run: cp dist/portfolio/index.html dist/portfolio/404.html
        
      # Fertigen Build hochladen
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
